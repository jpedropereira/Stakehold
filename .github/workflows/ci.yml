# GitHub Actions workflow mirroring the local pre-commit hooks.
#
# Design note: this runs the *same* pre-commit config, with the *same* lockfile-pinned
# pre-commit, as local hooks -- rather than re-declaring lint rules separately in CI
# steps. One config, one tool version, two enforcement points, so there's never a case
# where CI and local hooks disagree about what "passing" means. It exists because local
# hooks alone only protect contributors who ran `pre-commit install` and didn't pass
# `--no-verify`; CI is the backstop that can't be skipped.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    # The integration suite talks to a real Postgres rather than a fake, because what it
    # covers is precisely the part a fake can't: COPY-into-temp-table upserts, ON CONFLICT
    # semantics, and whether schema.sql's migrations stay idempotent. Locally that's the
    # docker compose stack; here it's a service container, so the same tests run in both
    # places instead of only on the machine of whoever remembered to start Postgres.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: data_store
          POSTGRES_USER: data_store
          POSTGRES_PASSWORD: ci-throwaway  # pragma: allowlist secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # Separate container, not a second database on the same instance: auth's real deployment
      # is a dedicated Postgres per docs/architecture.md, and a shared instance here would let a
      # cross-service query slip past a boundary CI is supposed to enforce.
      auth-postgres:
        image: postgres:17
        env:
          POSTGRES_DB: auth
          POSTGRES_USER: auth
          POSTGRES_PASSWORD: ci-throwaway  # pragma: allowlist secret
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # app-postgres: the shared application database portfolio (and any future non-data-store,
      # non-credential service) lives on. A third container for the same reason as auth's --
      # portfolio's real deployment is a separate instance, and collapsing them here would let a
      # cross-service query pass CI that production would refuse.
      #
      # POSTGRES_USER here is the admin bootstrap role, not portfolio's own -- see
      # docs/architecture.md's deployment section. `db init` creates the scoped `portfolio`
      # role itself, same as it does outside CI.
      app-postgres:
        image: postgres:17
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app_postgres_admin
          POSTGRES_PASSWORD: ci-throwaway-admin  # pragma: allowlist secret
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      # Pinned to an exact patch, not a floating major: setup-uv moved to immutable
      # releases in v8 and no longer publishes `v10`-style tags (that ref 404s).
      #
      # No `python-version:` here on purpose. The version lives in `.python-version` and
      # `requires-python`, and uv reads them -- duplicating it into the workflow is the
      # same drift trap this repo already avoids for flake8 config. (It was previously
      # passed to setup-uv@v3, which has no such input and silently ignored it, so CI has
      # in fact been getting its Python from `.python-version` all along.)
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # pre-commit is run directly rather than via pre-commit/action, for two reasons:
      # that action pip-installs its own unpinned pre-commit -- so CI linted with a
      # different version than the uv.lock-pinned one developers run, which is exactly the
      # local/CI divergence this workflow exists to prevent -- and it wraps actions/cache@v4,
      # a Node 20 action we can't pin from here.
      - name: Cache pre-commit environments
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', 'uv.lock') }}

      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure --color=always

      # Two steps, not one, because the root pyproject deselects `integration` by default
      # (`addopts = "-m 'not integration'"`) so a plain run never touches them. Kept separate
      # rather than merged into one `-m ''` invocation so a Postgres-side failure is
      # immediately distinguishable from a unit-test failure in the run summary.
      - name: Run unit test suite
        run: uv run pytest services

      - name: Run integration test suite
        run: uv run pytest services -m integration
        env:
          # Matches the service containers above. Ephemeral, created and destroyed with the
          # job -- not a credential to anything that outlives it.
          DATABASE_URL: postgresql://data_store:ci-throwaway@localhost:5432/data_store  # pragma: allowlist secret
          AUTH_DATABASE_URL: postgresql://auth:ci-throwaway@localhost:5434/auth  # pragma: allowlist secret
          # Admin: the app-postgres service container's own bootstrap role (see above) --
          # `db init` uses it once to create the `portfolio` role below, itself.
          APP_POSTGRES_ADMIN_DATABASE_URL: postgresql://app_postgres_admin:ci-throwaway-admin@localhost:5435/app  # pragma: allowlist secret
          PORTFOLIO_DATABASE_URL: postgresql://portfolio:ci-throwaway@localhost:5435/app  # pragma: allowlist secret
