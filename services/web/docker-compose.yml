# Standalone for now: this compose file starts only `web`, not `auth` alongside it. Joining
# `web` and `auth` (and, later, `portfolio`) onto one shared network with in-network URLs is
# walking-skeleton task 13's job (see docs/roadmap-archive/walking-skeleton.md) -- wiring that
# here piecemeal would leave two half-finished network topologies to reconcile later instead of
# one deliberate one. Until then,
# WEB_AUTH_API_URL in .env must point at wherever auth's own compose stack already publishes its
# API (its default: http://localhost:8001, or host.docker.internal:8001 from inside this
# container on Docker Desktop).

services:
  web:
    build:
      context: ../..
      dockerfile: services/web/Dockerfile
    image: ${WEB_IMAGE_NAME:-stakehold-web:local}
    container_name: web
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${WEB_API_PORT:-8000}:${WEB_API_PORT:-8000}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:${WEB_API_PORT:-8000}/health', timeout=3)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
