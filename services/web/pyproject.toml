[project]
name = "web"
version = "0.1.0"
description = "Web service"
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.0",
    "shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "httpx>=0.27",
    "python-multipart>=0.0.20",
]

[project.scripts]
web = "web.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web"]

[tool.uv.sources]
shared = { workspace = true }
