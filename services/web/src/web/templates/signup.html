{% extends "base.html" %}
{% block title %}Sign up — Stakehold{% endblock %}
{% block content %}
<section class="card card-narrow">
  <h1>Create your account</h1>
  <form hx-post="/signup" hx-target="#form-errors" hx-swap="innerHTML" method="post" action="/signup">
    <div id="form-errors">
      {% include "partials/_form_errors.html" %}
    </div>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="field">
      <label for="display_name">Name</label>
      <input type="text" id="display_name" name="display_name" required maxlength="100" autocomplete="name">
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="email">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required minlength="12" autocomplete="new-password">
    </div>
    <button type="submit" class="btn btn-primary">Sign up</button>
  </form>
  <p class="auth-switch">Already have an account? <a href="/login">Log in</a></p>
</section>
{% endblock %}
