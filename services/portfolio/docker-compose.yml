# app-postgres: the shared application database for non-data-store, non-credential services.
# It lives here because portfolio is its only tenant today -- the container is not portfolio's
# to own, only portfolio's to start. See docs/architecture.md's deployment section.
#
# POSTGRES_USER/PASSWORD here bootstrap an admin role, not the app's own role -- the official
# postgres image always grants that role superuser, so nothing in this file's control. `db init`
# uses it once, to create a separate non-superuser role per service, and the running app never
# connects as this role. See docs/architecture.md's deployment section.
#
# db-init and api run the same image with different entry points -- one applies the schema and
# exits, the other serves. Anchored here so their build context, image tag and DB wiring can't
# drift apart, same as auth's docker-compose.yml.
x-portfolio-image: &portfolio-image
  build:
    context: ../..
    dockerfile: services/portfolio/Dockerfile
  image: ${PORTFOLIO_API_IMAGE_NAME:-stakehold-portfolio-api:local}
  env_file:
    - .env
  environment:
    # Overrides the host-oriented URLs from .env (localhost:APP_POSTGRES_PORT, meant for a CLI
    # run from the host) with the in-network address the postgres container is reachable at
    # from other containers on this compose network -- the same override auth's compose file
    # makes for its own AUTH_DATABASE_URL.
    APP_POSTGRES_ADMIN_DATABASE_URL: postgresql://${APP_POSTGRES_ADMIN_USER}:${APP_POSTGRES_ADMIN_PASSWORD}@postgres:5432/${APP_POSTGRES_DB}
    PORTFOLIO_DATABASE_URL: postgresql://${APP_POSTGRES_USER}:${APP_POSTGRES_PASSWORD}@postgres:5432/${APP_POSTGRES_DB}

services:
  postgres:
    image: postgres:17
    container_name: app-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${APP_POSTGRES_DB}
      POSTGRES_USER: ${APP_POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${APP_POSTGRES_ADMIN_PASSWORD}
    ports:
      - "${APP_POSTGRES_PORT:-5435}:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_POSTGRES_ADMIN_USER} -d ${APP_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies db/schema.sql (and, on a first run, creates portfolio's own role/schema -- see
  # jobs._ensure_role_and_schema) and exits. A one-shot service rather than an api entrypoint
  # step because the schema is idempotent but not concurrency-safe: running it once, before
  # anything serves, keeps it that way even if `api` is ever scaled past one replica. Without it
  # the api container comes up against an empty database and 500s on every request.
  db-init:
    <<: *portfolio-image
    container_name: portfolio-db-init
    restart: "no"
    command: ["uv", "run", "--frozen", "portfolio", "db", "init"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *portfolio-image
    container_name: portfolio-api
    restart: unless-stopped
    ports:
      - "${PORTFOLIO_API_PORT:-8002}:${PORTFOLIO_API_PORT:-8002}"
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      # /health checks the schema, not just the process, so an api container talking to an
      # uninitialised database reports unhealthy instead of silently accepting traffic.
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:${PORTFOLIO_API_PORT:-8002}/health', timeout=3)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
