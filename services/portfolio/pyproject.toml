[project]
name = "portfolio"
version = "0.1.0"
description = "Portfolio service"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "psycopg[binary]>=3.3",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0",
    "requests>=2.32",
    "shared",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
portfolio = "portfolio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio"]

[tool.uv.sources]
shared = { workspace = true }
