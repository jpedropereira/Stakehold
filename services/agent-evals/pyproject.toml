[project]
name = "agent-evals"
version = "0.1.0"
description = "Offline eval harness for the agent service: datasets, graders, runner, reports"
requires-python = ">=3.14"
dependencies = [
    "agent",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_evals"]

[tool.uv.sources]
agent = { workspace = true }
