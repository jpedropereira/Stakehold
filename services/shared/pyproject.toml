[project]
name = "shared"
version = "0.1.0"
description = "Cross-service infrastructure (Postgres connection/schema-apply, log setup) reused by every service instead of duplicated"
requires-python = ">=3.14"
dependencies = [
    "psycopg[binary]>=3.3",
    "psycopg-pool>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]
