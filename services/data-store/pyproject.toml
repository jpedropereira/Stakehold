[project]
name = "data-store"
version = "0.1.0"
description = "Data store service"
requires-python = ">=3.14"
dependencies = [
    "playwright>=1.55",
    "pandas>=3.0",
    "psycopg[binary]>=3.3",
    "pyyaml>=6.0",
    "yfinance>=0.2",
    "python-dotenv>=1.0",
    "requests>=2.32",
]

[project.scripts]
data-store = "data_store.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_store"]
